<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tank Check</title>
<meta name="description" content="Walk the lab gas tank route, log every reading, copy a ready to paste Slack update.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eaeef4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tank Check">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ---------- palette ---------- */
:root{
  --bg:#eaeef4; --surface:#ffffff; --surface-2:#dde4ee;
  --text:#0b1220; --muted:#5a6472; --line:#c9d2e0;
  --accent:#1455d4; --accent-ink:#ffffff; --accent-soft:#e2ebff;
  --ok:#0d7a48; --warn:#9a4a12;
  --shadow:0 1px 2px rgba(11,18,32,.07), 0 10px 26px rgba(11,18,32,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0f15; --surface:#151d27; --surface-2:#1f2a37;
    --text:#f2f6fb; --muted:#a3b2c4; --line:#2d3947;
    --accent:#4f91ff; --accent-ink:#04101f; --accent-soft:#16283f;
    --ok:#46d68d; --warn:#ffb057;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.4);
  }
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit;color:inherit;margin:0;touch-action:manipulation;cursor:pointer}
.app{
  height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:6px 10px 2px;min-height:52px;flex:none}
.iconbtn{
  min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;padding:0 12px;border:0;background:transparent;border-radius:14px;
  color:var(--text);font-size:16px;font-weight:600;
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn[disabled]{opacity:.32}
.topbar .step{margin-left:auto;padding-right:8px;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{flex:none;height:4px;margin:0 16px 4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .18s ease}

/* ---------- screen shell ---------- */
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.titles{flex:none;display:flex;align-items:flex-start;gap:8px;padding:2px 14px 6px 18px}
.titletext{flex:1;min-width:0}
.flagbtn{
  flex:none;width:48px;height:48px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.flagbtn:active{background:var(--surface-2)}
.flagbtn.on{background:var(--warn);border-color:transparent;color:var(--accent-ink)}
.room{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tank{margin-top:2px;font-size:17px;font-weight:600;color:var(--muted)}

/* ---------- readout ---------- */
.readout{flex:none;display:flex;align-items:baseline;justify-content:center;gap:8px;padding:4px 0 6px}
.readout .num{font-size:clamp(52px,17vw,80px);font-weight:800;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.readout .unit{font-size:20px;font-weight:700;color:var(--muted)}

/* ---------- vertical slider ---------- */
.sliderwrap{flex:1;min-height:110px;display:grid;grid-template-columns:58px 138px 58px;justify-content:center;padding:4px 0 8px}
.sl{grid-column:2;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;outline:none}
.sl-track{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.sl-fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.sl-thumb{
  position:absolute;top:0;left:-7px;right:-7px;height:54px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  will-change:transform;
}
.sl-thumb i{display:block;width:30px;height:2px;border-radius:2px;background:var(--muted);opacity:.85}
.sl.dragging .sl-thumb{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
.sl:focus-visible .sl-thumb{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
.sl-ticks{position:absolute;top:0;bottom:0;left:-58px;width:50px;pointer-events:none}
.sl-ticks span{position:absolute;right:0;transform:translateY(50%);font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- buttons ---------- */
.controls{flex:none;display:flex;flex-direction:column;gap:10px;padding:6px 16px 14px}
.btnrow{display:flex;gap:10px}
.btn{
  flex:1;min-height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:18px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow);
}
.btn:active{transform:translateY(1px);background:var(--surface-2)}
.btn-primary{min-height:64px;font-size:20px;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-primary:active{background:var(--accent);filter:brightness(.94)}
.btn-primary[disabled]{opacity:.45}
.btn-quiet{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted);font-size:17px;min-height:52px}
.btn-lg{min-height:64px;font-size:20px}
.btn-warn{color:var(--warn)}

/* ---------- storage counters ---------- */
.rows{display:flex;flex-direction:column;gap:10px;padding:4px 16px 16px}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);
}
.row .label{font-size:18px;font-weight:700}
.counter{display:flex;align-items:center;gap:6px}
.cbtn{
  width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);
  display:inline-flex;align-items:center;justify-content:center;
}
.cbtn:active{background:var(--accent-soft)}
.cbtn[disabled]{opacity:.35}
.count{min-width:48px;text-align:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{padding:0 18px 8px;font-size:15px;color:var(--muted);line-height:1.45}

/* ---------- pH screen ---------- */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:8px 20px;min-height:0}
.prompt{font-size:24px;font-weight:700;line-height:1.35;text-align:center}
.note{
  width:100%;min-height:104px;padding:14px;border-radius:16px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:18px;resize:none;
  -webkit-user-select:text;user-select:text;
}
.note:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- home / review / output ---------- */
.pad{padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.hero{padding:14px 18px 2px}
.hero h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em}
.hero p{margin:6px 0 0;font-size:17px;color:var(--muted);line-height:1.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px;font-weight:700}
.card p{margin:0;font-size:15px;color:var(--muted);line-height:1.45}
.group{margin:14px 0 6px;padding:0 18px;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;min-height:64px;margin-bottom:8px;box-shadow:var(--shadow);
}
.item:active{background:var(--surface-2)}
.item .who{font-size:17px;font-weight:700;flex:0 0 auto;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .what{font-size:17px;font-weight:700;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;flex:1 1 auto;min-width:0}
.item .chev{color:var(--muted);display:flex;flex:none}
.item .what.small{font-size:15px;font-weight:600}
.msg{
  margin:0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  font-size:15.5px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);
  -webkit-user-select:text;user-select:text;
}
.msg b{font-weight:800}

/* ---------- sheets over the screen ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:center;
  background:rgba(6,10,16,.58);padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
.overlay.bottom{align-items:flex-end}
.sheet{
  width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);
}
.sheet h2{margin:0;font-size:22px;font-weight:800;line-height:1.3}
.sheet .where{margin:0 0 2px;font-size:15px;font-weight:600;color:var(--muted)}
.cardrow{display:flex;align-items:center;gap:12px}
.cardicon{
  flex:none;width:44px;height:44px;border-radius:13px;background:var(--warn);
  color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
}
.item .flag{flex:none;display:flex;color:var(--warn)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);
  max-width:calc(100% - 32px);padding:13px 20px;border-radius:999px;
  background:var(--text);color:var(--bg);font-size:16px;font-weight:700;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- short screens (landscape) ---------- */
@media (max-height:600px){
  .readout .num{font-size:46px}
  .room{font-size:21px}
  .tank{font-size:15px}
  .sliderwrap{min-height:76px}
  .btn{min-height:50px}
  .btn-primary{min-height:54px;font-size:18px}
  .hero h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================================
   CONFIG
   --------------------------------------------------------------------------
   Everything a labmate might need to change lives in this one object.
   You should never have to touch anything below the "END OF CONFIG" line.

   The app walks "route" from top to bottom, in order. Reorder the entries
   here and both the screens and the Slack message reorder to match.

   There are three kinds of stop:

     type: "room"  one slider screen per tank, then a storage screen
                   if storage is true.
     type: "ln"    one 0 to 100 percent slider screen.
     type: "ph"    the pH probe confirmation screen.

   For a room:
     name     Shown big at the top of the screen, and in the Slack message.
     number   Room number, shown next to the name: Secondary (3326).
     storage  true  = ask for stored cylinder counts and print a Storage line.
              false = skip the storage screen, print no Storage line at all.
     tanks    One entry per tank that is currently running:
                label  what the screen calls it, e.g. "CO2 Tank 1"
                gas    what the Slack message calls it, e.g. "CO2"
                min    bottom of the slider, in psi
                max    top of the slider, in psi
                start  OPTIONAL starting value. Leave it out and the slider
                       starts halfway up.

   To add a tank:    add another { label, gas, min, max } line to that room.
   To remove a tank: delete its line.
   To add a room:    copy a whole { type: "room", ... } block and edit it.
   To change the walking order: move the blocks up or down in the list.
   ========================================================================== */

var CONFIG = {

  /* Shown on the opening screen. */
  appTitle: "Tank Check",

  /* The walking route, in the order you physically walk it. */
  route: [

    {
      type: "room",
      name: "Secondary",
      number: "3326",
      storage: true,
      tanks: [
        { label: "N2 Tank 1",  gas: "N2",  min: 0, max: 3000 },
        { label: "CO2 Tank 1", gas: "CO2", min: 0, max: 1200 },
        { label: "CO2 Tank 2", gas: "CO2", min: 0, max: 1200 }
      ]
    },

    {
      type: "ln",
      name: "LN",          /* shown on the screen: LN (3325) */
      number: "3325",
      title: "LN",         /* the heading used in the Slack message */
      min: 0,
      max: 100
    },

    {
      type: "room",
      name: "Primary",
      number: "3343",
      storage: true,
      tanks: [
        { label: "CO2 Tank 1", gas: "CO2", min: 0, max: 1200 },
        { label: "CO2 Tank 2", gas: "CO2", min: 0, max: 1200 }
      ]
    },

    {
      type: "room",
      name: "911 Room",
      number: "3346",
      storage: false,
      tanks: [
        { label: "CO2 Tank 1", gas: "CO2", min: 0, max: 2000 },
        { label: "N2 Tank 1",  gas: "N2",  min: 0, max: 3000 }
      ]
    },

    {
      type: "room",
      name: "iPSC Room",
      number: "2308",
      storage: false,
      tanks: [
        { label: "CO2 Tank 1", gas: "CO2", min: 0, max: 1200 },
        { label: "CO2 Tank 2", gas: "CO2", min: 0, max: 1200 }
      ]
    },

    {
      type: "ph",
      title: "pH Probe"    /* the heading used in the Slack message */
    }

  ],

  /* How the sliders move. */
  psiStep: 50,       /* dragging snaps to this many psi */
  psiFineStep: 10,   /* the two small buttons under a psi slider */
  pctStep: 1,        /* dragging the LN slider snaps to whole percents */
  pctFineStep: 1,    /* the two small buttons under the LN slider */

  /* The four counters on every storage screen, in the order they are
     listed on screen and in the Slack message.
       key    internal name, must stay unique
       label  what the screen calls it
       gas    what the Slack message calls it
       state  "full" or "empty", printed in parentheses */
  storageItems: [
    { key: "n2Full",   label: "N2 full",   gas: "N2",  state: "full"  },
    { key: "n2Empty",  label: "N2 empty",  gas: "N2",  state: "empty" },
    { key: "co2Full",  label: "CO2 full",  gas: "CO2", state: "full"  },
    { key: "co2Empty", label: "CO2 empty", gas: "CO2", state: "empty" }
  ],

  /* The pH probe screen and its two outcomes. Whoever walks the route either
     found the probe already calibrated, or calibrated it themselves today,
     and the message says which. */
  ph: {
    prompt: "Verify the pH probe is calibrated and stored correctly. If it is not calibrated, calibrate it now.",
    alreadyButton: "Already calibrated",
    alreadyLine: "Calibrated and stored correctly",
    recalButton: "I recalibrated it today",
    recalLine: "Recalibrated today, stored correctly"
  },

  /* The attention flag: the warning button at the top right of every screen.
     Anyone can tap it to mark something worth mentioning, with or without a
     note. A flagged screen adds an ATTENTION line under its own room in the
     message and puts a warning emoji beside that room's name.

     The app also offers to raise a flag by itself when a reading looks bad.
     {gas} in the wording below is replaced with N2, CO2 or LN. */
  attention: {
    homeHint: "Tap this at the top right of any screen to flag something that needs attention.",
    sheetTitle: "Needs attention",
    notePlaceholder: "Low tank, nothing left in storage, etc.",
    linePrefix: "ATTENTION: ",     /* when a note was typed */
    lineBare: "ATTENTION",         /* when it was flagged without a note */

    /* Added after the room name. This is the real warning character, not the
       :warning: shortcode, because Slack only turns a shortcode into an emoji
       while you type it. Pasted text is left exactly as it is. */
    roomMark: " ⚠️",
    roomMarkCode: " :warning:",    /* only used when copyStyle is "markup" */

    /* Offered after confirming a tank at or below its alert reading. */
    emptyTankAsk: "Create an alert for empty {gas}?",
    emptyTankNote: "Empty {gas}",

    /* Offered after confirming a storage screen with no full cylinders of a
       gas left, when at least one empty is sitting there. */
    noFullAsk: "Create an alert for no full {gas} in storage?",
    noFullNote: "No full {gas} in storage"
  },

  /* Confirming a tank at or below this reading offers an alert. 0 means only
     a completely empty tank. One tank can override it with its own
     alertAtOrBelow, so a single tank could warn at 200 psi while the rest
     wait for 0. The LN screen uses it too, as a percentage. */
  alertAtOrBelow: 0,

  /* The Slack message is NOT printed in walking order. You walk past LN
     second, but the message prints all the rooms first and LN near the end,
     the way the lab has always written it. This list sets the section order of
     the message by stop type: every "room" first (in route order), then "ln",
     then "ph". Set it to [] to make the message follow the walk exactly. */
  messageOrder: ["room", "ln", "ph"],

  /* The first line of the Slack message. The date in M/D form is added. */
  messageTitle: "Tank Update",

  /* Copy puts two versions of the message on the clipboard at once: a
     formatted one, where the room names are really bold, and a plain text one
     for anywhere that cannot take formatting. Slack takes the formatted one,
     so the room names arrive bold with no asterisks to clean up.

     This setting only controls that plain text second copy:
       "clean"   no markup at all. Nothing to tidy up if it is the one used.
       "unicode" bold letters drawn from Unicode, which need no formatting
                 support at all, but cannot be found by a Slack search.
       "markup"  the old *asterisk* and :warning: style, for typing by hand. */
  copyStyle: "clean",

  /* Vibration in milliseconds when a slider crosses a snap point.
     Set to 0 to turn the haptic tick off. Android only, iOS ignores it. */
  hapticMs: 8
};

/* ==========================  END OF CONFIG  ============================== */


/* ---------- tiny helpers ---------- */
var STORE_KEY = "tankcheck.session.v1";

function h(tag, attrs, kids){
  var n = document.createElement(tag), k, v;
  if (attrs) for (k in attrs){
    v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  if (kids){
    if (!Array.isArray(kids)) kids = [kids];
    for (var i=0;i<kids.length;i++){
      var c = kids[i];
      if (c === null || c === undefined || c === false) continue;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
  }
  return n;
}
function pick(a, b){ return (a === undefined || a === null) ? b : a; }
function svg(d, size, w){
  return '<svg viewBox="0 0 24 24" width="' + (size||24) + '" height="' + (size||24) +
         '" fill="none" stroke="currentColor" stroke-width="' + (w||2.4) +
         '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
}
var ICON = {
  back:  svg('<path d="M15 5l-7 7 7 7"/>'),
  chev:  svg('<path d="M9 5l7 7-7 7"/>', 20, 2.2),
  check: svg('<path d="M4 12.5l5.5 5.5L20 6"/>', 26, 3),
  plus:  svg('<path d="M12 5v14M5 12h14"/>', 26, 2.8),
  minus: svg('<path d="M5 12h14"/>', 26, 2.8),
  copy:  svg('<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"/>', 24, 2.2),
  warn:  svg('<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9L2.6 17.4A2 2 0 0 0 4.3 20.4h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>', 24, 2.2),
  warnSm: svg('<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9L2.6 17.4A2 2 0 0 0 4.3 20.4h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>', 19, 2.4)
};
function buzz(){
  if (!CONFIG.hapticMs) return;
  try { if (navigator.vibrate) navigator.vibrate(CONFIG.hapticMs); } catch(e){}
}
var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}
function todayMD(){
  var d = new Date();
  return (d.getMonth()+1) + "/" + d.getDate();
}
function relTime(ts){
  var s = Math.max(0, Math.round((Date.now() - ts)/1000));
  if (s < 90) return "just now";
  var m = Math.round(s/60);
  if (m < 60) return m + " min ago";
  var hr = Math.round(m/60);
  if (hr < 24) return hr === 1 ? "1 hour ago" : hr + " hours ago";
  var d = Math.round(hr/24);
  return d === 1 ? "yesterday" : d + " days ago";
}


/* ---------- build the list of screens from CONFIG ---------- */
function buildScreens(){
  var out = [];
  CONFIG.route.forEach(function(stop, si){
    if (stop.type === "room"){
      (stop.tanks || []).forEach(function(tank, ti){
        out.push({
          kind: "psi",
          id: "psi|" + stop.number + "|" + tank.label,
          stopIndex: si, tankIndex: ti,
          heading: stop.name + " (" + stop.number + ")",
          sub: tank.label,
          min: pick(tank.min, 0), max: pick(tank.max, 3000),
          step: CONFIG.psiStep, fine: CONFIG.psiFineStep,
          unit: "psi", start: tank.start
        });
      });
      if (stop.storage){
        out.push({
          kind: "storage",
          id: "storage|" + stop.number,
          stopIndex: si,
          heading: stop.name + " (" + stop.number + ")",
          sub: "Storage"
        });
      }
    } else if (stop.type === "ln"){
      out.push({
        kind: "ln",
        id: "ln|" + pick(stop.number, stop.title),
        stopIndex: si,
        heading: stop.name + (stop.number ? " (" + stop.number + ")" : ""),
        sub: pick(stop.title, "LN") + " level",
        min: pick(stop.min, 0), max: pick(stop.max, 100),
        step: CONFIG.pctStep, fine: CONFIG.pctFineStep,
        unit: "%", start: stop.start
      });
    } else if (stop.type === "ph"){
      out.push({
        kind: "ph",
        id: "ph|" + si,
        stopIndex: si,
        heading: pick(stop.title, "pH Probe"),
        sub: "Last stop"
      });
    }
  });
  return out;
}
var SCREENS = buildScreens();

/* A fingerprint of the route. If CONFIG changes, an old saved session is
   thrown away instead of being restored onto the wrong screens. */
var SIGNATURE = (function(){
  var s = SCREENS.map(function(x){ return x.id + ":" + pick(x.min,"") + "-" + pick(x.max,""); }).join("|");
  var hash = 5381;
  for (var i=0;i<s.length;i++){ hash = ((hash*33) ^ s.charCodeAt(i)) >>> 0; }
  return hash.toString(36) + "." + SCREENS.length;
})();

function snapTo(v, step, min, max){
  var out = Math.round((v - min)/step)*step + min;
  if (out < min) out = min;
  if (out > max) out = max;
  return Math.round(out*1000)/1000;
}
function defaultValue(screen){
  if (typeof screen.start === "number") return snapTo(screen.start, screen.step, screen.min, screen.max);
  return snapTo((screen.min + screen.max)/2, screen.step, screen.min, screen.max);
}
function emptyStorage(){
  var o = {};
  CONFIG.storageItems.forEach(function(it){ o[it.key] = 0; });
  return o;
}
function answerFor(screen){
  var a = state.answers[screen.id];
  if (a !== undefined && a !== null) return a;
  if (screen.kind === "psi" || screen.kind === "ln") return defaultValue(screen);
  if (screen.kind === "storage") return emptyStorage();
  if (screen.kind === "ph") return { state: "already" };
  return null;
}


/* ---------- state and persistence ---------- */
var state = {
  phase: "home",       /* home | check | review | output */
  index: 0,            /* which screen of SCREENS */
  answers: {},
  flags: {},           /* screen id -> attention note, "" when none was typed */
  editing: false,      /* true when the screen was opened from the review list */
  original: null       /* value to restore if that edit is cancelled */
};
var saved = null;      /* a restorable session found in localStorage */

function readSaved(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || o.sig !== SIGNATURE) { localStorage.removeItem(STORE_KEY); return null; }
    return o;
  } catch(e){ return null; }
}
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 180);
}
function saveNow(){
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v: 1, sig: SIGNATURE, savedAt: Date.now(),
      phase: state.phase === "home" ? "check" : state.phase,
      index: state.index,
      answers: state.answers,
      flags: state.flags
    }));
  } catch(e){}
}
function clearSaved(){
  clearTimeout(saveTimer);
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
  saved = null;
}
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", function(){ if (document.hidden) saveNow(); });


/* ---------- the Slack message ---------- */
function storageText(counts){
  var parts = [];
  CONFIG.storageItems.forEach(function(it){
    var n = (counts && counts[it.key]) || 0;
    if (n > 0) parts.push(n + " " + it.gas + " (" + it.state + ")");
  });
  return parts.length ? parts.join(", ") : "none";
}
/* Which gases the storage counters cover, in the order they are listed. */
function storageGases(){
  var seen = [];
  CONFIG.storageItems.forEach(function(it){
    if (seen.indexOf(it.gas) < 0) seen.push(it.gas);
  });
  return seen;
}
/* Every attention note raised anywhere in one stop, in walking order. */
function flagsForStop(si){
  var out = [];
  SCREENS.forEach(function(s){
    if (s.stopIndex === si && state.flags[s.id] !== undefined) out.push(state.flags[s.id]);
  });
  return out;
}
function attentionLines(si){
  return flagsForStop(si).map(function(note){
    note = String(note || "").trim();
    return note ? CONFIG.attention.linePrefix + note : CONFIG.attention.lineBare;
  });
}
function phState(a){ return (a && a.state === "recal") ? "recal" : "already"; }

function screenById(id){
  for (var i=0;i<SCREENS.length;i++) if (SCREENS[i].id === id) return SCREENS[i];
  return null;
}
/* The route in the order the message prints it, which is not the order you
   walk it in. See CONFIG.messageOrder. */
function messageStops(){
  var order = CONFIG.messageOrder || [];
  return CONFIG.route.map(function(stop, si){
    var rank = order.indexOf(stop.type);
    return { stop: stop, si: si, rank: (rank < 0 ? order.length : rank) };
  }).sort(function(a, b){
    return (a.rank - b.rank) || (a.si - b.si);
  });
}
/* The message as a list of lines. A line is one of:
     { head:true, text:..., warn:true }  a room name, bold, maybe flagged
     { text:... }                        an ordinary line
     { blank:true }                      the gap between sections
   Keeping the headings marked rather than wrapped in asterisks is what lets
   the same message be copied as real formatting. */
function buildMessageLines(){
  var lines = [];
  lines.push({ head:true, text: CONFIG.messageTitle + " (" + todayMD() + ")" });

  messageStops().forEach(function(entry){
    var stop = entry.stop, si = entry.si;
    var mine = SCREENS.filter(function(s){ return s.stopIndex === si; });
    var warn = flagsForStop(si).length > 0;

    if (stop.type === "room"){
      lines.push({ blank:true });
      lines.push({ head:true, text: stop.name + " (" + stop.number + ")", warn: warn });
      var running = mine.filter(function(s){ return s.kind === "psi"; }).map(function(s){
        var tank = stop.tanks[s.tankIndex];
        return tank.gas + " " + answerFor(s) + " psi";
      });
      if (running.length) lines.push({ text: "Running: " + running.join(" | ") });
      if (stop.storage){
        var st = mine.filter(function(s){ return s.kind === "storage"; })[0];
        lines.push({ text: "Storage: " + storageText(st ? answerFor(st) : null) });
      }
    } else if (stop.type === "ln"){
      lines.push({ blank:true });
      lines.push({ head:true, text: pick(stop.title, "LN"), warn: warn });
      lines.push({ text: "Level: " + answerFor(mine[0]) + "%" });
    } else if (stop.type === "ph"){
      lines.push({ blank:true });
      lines.push({ head:true, text: pick(stop.title, "pH Probe"), warn: warn });
      lines.push({ text: phState(answerFor(mine[0])) === "recal" ? CONFIG.ph.recalLine : CONFIG.ph.alreadyLine });
    }

    attentionLines(si).forEach(function(t){ lines.push({ text: t }); });
  });

  return lines;
}

/* Bold letters that need no formatting support, for copyStyle "unicode". */
function boldUnicode(str){
  var out = "", c, i;
  for (i = 0; i < str.length; i++){
    c = str.charCodeAt(i);
    if (c >= 65 && c <= 90)       out += String.fromCodePoint(0x1D5D4 + (c - 65));
    else if (c >= 97 && c <= 122) out += String.fromCodePoint(0x1D5EE + (c - 97));
    else if (c >= 48 && c <= 57)  out += String.fromCodePoint(0x1D7EC + (c - 48));
    else out += str.charAt(i);
  }
  return out;
}

function messagePlain(lines, style){
  var mark = CONFIG.attention.roomMark;
  return lines.map(function(l){
    if (l.blank) return "";
    if (!l.head) return l.text;
    if (style === "markup") return "*" + l.text + "*" + (l.warn ? CONFIG.attention.roomMarkCode : "");
    if (style === "unicode") return boldUnicode(l.text) + (l.warn ? mark : "");
    return l.text + (l.warn ? mark : "");
  }).join("\n");
}

function escapeHtml(str){
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* The formatted version that goes on the clipboard beside the plain one.

   Every line is its own <div> and the empty ones hold a non breaking space.
   Both of those matter. Slack reads pasted HTML into its own format one block
   at a time, so separate blocks are what keep the lines apart, and a run of
   <br> tags gets collapsed to a single break, which silently ate the gaps
   between sections. A line holding a non breaking space is a line with
   something in it, so there is nothing left to collapse.

   No <pre> and no <p>: the first reads as a code block in some chat apps, the
   second brings its own margins. */
function messageHtml(lines){
  return lines.map(function(l){
    if (l.blank) return "<div>&nbsp;</div>";
    if (l.head) return "<div><b>" + escapeHtml(l.text) + "</b>" + (l.warn ? CONFIG.attention.roomMark : "") + "</div>";
    return "<div>" + escapeHtml(l.text) + "</div>";
  }).join("");
}

/* The plain text version, which is also what the tests read. */
function buildMessage(){
  return messagePlain(buildMessageLines(), CONFIG.copyStyle);
}


/* ---------- the vertical slider ---------- */
/* Only one slider is on screen at a time. render() shuts the previous one
   down, so a detached slider can never write a stale reading back into the
   answers when it sees a resize. */
var activeSlider = null;

function makeSlider(opts){
  /* opts: min, max, step, fine, unit, value, label, onInput */
  var THUMB = 54;
  var value = opts.value;
  var dead = false;

  var fill  = h("div", { class:"sl-fill" });
  var track = h("div", { class:"sl-track" }, fill);
  var thumb = h("div", { class:"sl-thumb" }, [h("i"), h("i"), h("i")]);
  var ticks = h("div", { class:"sl-ticks" });
  var tickEls = [];
  var steps = 4;
  for (var i=0;i<=steps;i++){
    var frac = i/steps;
    var el = h("span", { text: String(Math.round(opts.min + frac*(opts.max-opts.min))) });
    el._frac = frac;
    tickEls.push(el);
    ticks.appendChild(el);
  }

  var root = h("div", {
    class: "sl", tabindex: "0", role: "slider",
    "aria-label": opts.label || "value",
    "aria-valuemin": String(opts.min), "aria-valuemax": String(opts.max)
  }, [track, thumb, ticks]);

  function fraction(){ return (value - opts.min) / (opts.max - opts.min); }

  function paint(){
    if (dead) return;
    var hgt = root.clientHeight;
    var span = Math.max(1, hgt - THUMB);
    var f = fraction();
    thumb.style.transform = "translateY(" + ((1-f)*span) + "px)";
    fill.style.height = (f*span + THUMB/2) + "px";
    for (var i=0;i<tickEls.length;i++){
      tickEls[i].style.bottom = (THUMB/2 + tickEls[i]._frac*span) + "px";
    }
    root.setAttribute("aria-valuenow", String(value));
    root.setAttribute("aria-valuetext", value + " " + opts.unit);
    if (opts.onInput) opts.onInput(value);
  }

  function clamp(v){
    if (v < opts.min) v = opts.min;
    if (v > opts.max) v = opts.max;
    return Math.round(v*1000)/1000;
  }
  function setValue(v, haptic){
    v = clamp(v);
    if (v === value) return;
    value = v;
    paint();
    if (haptic) buzz();
  }

  var dragging = false, grabOffset = 0;
  function valueFromY(clientY){
    var r = root.getBoundingClientRect();
    var span = Math.max(1, r.height - THUMB);
    var top = clientY - r.top - grabOffset - THUMB/2;   /* wanted thumb top */
    var f = 1 - (top / span);
    if (f < 0) f = 0;
    if (f > 1) f = 1;
    return snapTo(opts.min + f*(opts.max-opts.min), opts.step, opts.min, opts.max);
  }
  root.addEventListener("pointerdown", function(e){
    e.preventDefault();
    var r = root.getBoundingClientRect();
    var span = Math.max(1, r.height - THUMB);
    var thumbTop = (1 - fraction())*span;
    var local = e.clientY - r.top;
    /* grabbing the thumb drags it relatively, tapping the track jumps to it */
    grabOffset = (local >= thumbTop && local <= thumbTop + THUMB) ? (local - thumbTop - THUMB/2) : 0;
    dragging = true;
    root.classList.add("dragging");
    try { root.setPointerCapture(e.pointerId); } catch(err){}
    root.focus({ preventScroll:true });
    setValue(valueFromY(e.clientY), true);
  });
  root.addEventListener("pointermove", function(e){
    if (!dragging) return;
    e.preventDefault();
    setValue(valueFromY(e.clientY), true);
  });
  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    root.classList.remove("dragging");
    try { root.releasePointerCapture(e.pointerId); } catch(err){}
  }
  root.addEventListener("pointerup", endDrag);
  root.addEventListener("pointercancel", endDrag);
  root.addEventListener("keydown", function(e){
    var d = 0;
    if (e.key === "ArrowUp"   || e.key === "ArrowRight") d =  opts.step;
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft")  d = -opts.step;
    else if (e.key === "PageUp")   d =  opts.step*5;
    else if (e.key === "PageDown") d = -opts.step*5;
    else if (e.key === "Home"){ e.preventDefault(); setValue(opts.min); return; }
    else if (e.key === "End"){  e.preventDefault(); setValue(opts.max); return; }
    else return;
    e.preventDefault();
    setValue(value + d);
  });

  var observer = null;
  if (window.ResizeObserver){
    try { observer = new ResizeObserver(paint); observer.observe(root); } catch(err){}
  }
  window.addEventListener("resize", paint);
  requestAnimationFrame(paint);

  return {
    el: root,
    get: function(){ return value; },
    nudge: function(delta){ setValue(value + delta, true); },
    paint: paint,
    destroy: function(){
      dead = true;
      if (observer){ try { observer.disconnect(); } catch(err){} observer = null; }
      window.removeEventListener("resize", paint);
    }
  };
}


/* ---------- the attention flag ---------- */
var overlay = null;
function overlayKey(e){
  if (e.key === "Escape" && overlay && overlay._cancel) overlay._cancel();
}
function closeOverlay(){
  if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
  overlay = null;
  document.removeEventListener("keydown", overlayKey);
}
function showOverlay(sheet, onCancel, atBottom){
  closeOverlay();
  overlay = h("div", { class:"overlay" + (atBottom ? " bottom" : "") }, sheet);
  overlay._cancel = onCancel;
  document.body.appendChild(overlay);
  document.addEventListener("keydown", overlayKey);
}

/* The note sheet. prefill is the suggested text, or null to edit whatever is
   already there. onClose runs instead of a plain re-render when this sheet is
   part of a chain, so the chain can carry on. */
function openFlagSheet(screen, prefill, onClose){
  var existing = state.flags[screen.id];
  var ta = h("textarea", {
    class:"note", rows:"3", maxlength:"140",
    placeholder: CONFIG.attention.notePlaceholder, "aria-label":"Note"
  });
  ta.value = (prefill === null || prefill === undefined)
    ? (existing === undefined ? "" : existing)
    : prefill;

  function done(){
    closeOverlay();
    if (onClose) onClose(); else render();
  }

  showOverlay(h("div", { class:"sheet" }, [
    h("h2", { text: CONFIG.attention.sheetTitle }),
    h("p", { class:"where", text: screen.heading + " / " + screen.sub }),
    ta,
    h("button", { class:"btn btn-primary", type:"button", onclick: function(){
      state.flags[screen.id] = ta.value.trim();
      saveNow();
      done();
    }}, [h("span", { class:"chev", html: ICON.check }), h("span", { text:"Confirm" })]),
    existing === undefined ? null :
      h("button", { class:"btn btn-quiet btn-warn", type:"button", onclick: function(){
        delete state.flags[screen.id];
        saveNow();
        done();
      }}, "Remove flag"),
    h("button", { class:"btn btn-quiet", type:"button", onclick: done }, "Cancel")
  ]), done, false);

  setTimeout(function(){ try { ta.focus(); } catch(e){} }, 60);
}

/* The short yes or no prompt the app raises by itself. */
function askSheet(question, onYes, onSkip){
  showOverlay(h("div", { class:"sheet" }, [
    h("h2", { text: question }),
    h("button", { class:"btn btn-primary", type:"button", onclick: function(){ closeOverlay(); onYes(); } },
      [h("span", { class:"chev", html: ICON.warn }), h("span", { text:"Yes" })]),
    h("button", { class:"btn btn-quiet", type:"button", onclick: function(){ closeOverlay(); onSkip(); } }, "Skip")
  ]), function(){ closeOverlay(); onSkip(); }, true);
}

function fillGas(text, gas){ return String(text).replace("{gas}", gas); }

/* Readings that are worth offering a flag for, checked when a screen is
   confirmed. The app suggests, it never flags anything on its own, and it
   asks whether or not the screen is already flagged. */
function pendingAsks(screen){
  var out = [];
  var stop = CONFIG.route[screen.stopIndex];
  var limit;

  if (screen.kind === "psi"){
    var tank = stop.tanks[screen.tankIndex];
    limit = pick(tank.alertAtOrBelow, CONFIG.alertAtOrBelow);
    if (typeof limit === "number" && answerFor(screen) <= limit){
      out.push({ ask: fillGas(CONFIG.attention.emptyTankAsk, tank.gas),
                 note: fillGas(CONFIG.attention.emptyTankNote, tank.gas) });
    }
  } else if (screen.kind === "ln"){
    var name = pick(stop.title, "LN");
    limit = pick(stop.alertAtOrBelow, CONFIG.alertAtOrBelow);
    if (typeof limit === "number" && answerFor(screen) <= limit){
      out.push({ ask: fillGas(CONFIG.attention.emptyTankAsk, name),
                 note: fillGas(CONFIG.attention.emptyTankNote, name) });
    }
  } else if (screen.kind === "storage"){
    var counts = answerFor(screen);
    storageGases().forEach(function(gas){
      var full = 0, empty = 0;
      CONFIG.storageItems.forEach(function(it){
        if (it.gas !== gas) return;
        var n = (counts && counts[it.key]) || 0;
        if (it.state === "full") full += n; else empty += n;
      });
      /* nothing full left, with empties sitting there to prove the slot is used */
      if (full === 0 && empty > 0){
        out.push({ ask: fillGas(CONFIG.attention.noFullAsk, gas),
                   note: fillGas(CONFIG.attention.noFullNote, gas) });
      }
    });
  }
  return out;
}

/* ---------- navigation ---------- */
function goHome(){ state.phase = "home"; render(); }
function startFresh(){
  closeOverlay();
  clearSaved();
  state.answers = {};
  state.flags = {};
  state.index = 0;
  state.phase = "check";
  state.editing = false;
  saveNow();
  render();
}
function resume(){
  var s = readSaved();
  if (!s){ startFresh(); return; }
  state.answers = s.answers || {};
  state.flags = s.flags || {};
  state.index = Math.min(Math.max(0, s.index || 0), SCREENS.length-1);
  state.phase = (s.phase === "review" || s.phase === "output") ? s.phase : "check";
  state.editing = false;
  render();
}
/* Confirming a screen first offers any flags the readings suggest, one after
   another, and only then moves on. */
function confirmScreen(){
  var screen = SCREENS[state.index];
  runAsks(screen, pendingAsks(screen), 0);
}
function runAsks(screen, asks, i){
  if (i >= asks.length){ advanceScreen(); return; }
  var a = asks[i];
  askSheet(a.ask,
    function(){ openFlagSheet(screen, a.note, function(){ runAsks(screen, asks, i + 1); }); },
    function(){ runAsks(screen, asks, i + 1); });
}
function advanceScreen(){
  if (state.editing){
    state.editing = false;
    state.original = null;
    state.phase = "review";
  } else if (state.index >= SCREENS.length - 1){
    state.phase = "review";
  } else {
    state.index++;
  }
  saveNow();
  render();
}
function goBack(){
  closeOverlay();
  if (state.editing){
    var s = SCREENS[state.index];
    if (state.original === null || state.original === undefined) delete state.answers[s.id];
    else state.answers[s.id] = state.original;
    state.editing = false;
    state.original = null;
    state.phase = "review";
  } else if (state.index === 0){
    state.phase = "home";
  } else {
    state.index--;
  }
  saveNow();
  render();
}
function editFromReview(i){
  state.index = i;
  state.editing = true;
  var s = SCREENS[i];
  var cur = state.answers[s.id];
  state.original = (cur === undefined) ? null : JSON.parse(JSON.stringify(cur));
  state.phase = "check";
  render();
}

/* ---------- screens ---------- */
function screenSlider(screen){
  var readNum = h("div", { class:"num", text:"0" });
  var wrap = h("div", { class:"sliderwrap" });

  var slider = makeSlider({
    min: screen.min, max: screen.max, step: screen.step, unit: screen.unit,
    value: answerFor(screen), label: screen.heading + " " + screen.sub,
    onInput: function(v){
      readNum.textContent = String(v);
      state.answers[screen.id] = v;
      save();
    }
  });
  wrap.appendChild(slider.el);
  activeSlider = slider;

  var fineLabel = function(n){ return (n > 0 ? "+" : "") + n; };
  return h("div", { class:"screen" }, [
    titles(screen),
    h("div", { class:"readout" }, [readNum, h("div", { class:"unit", text: screen.unit })]),
    wrap,
    h("div", { class:"controls" }, [
      h("div", { class:"btnrow" }, [
        h("button", { class:"btn", type:"button", "aria-label":"minus " + screen.fine + " " + screen.unit,
          onclick: function(){ slider.nudge(-screen.fine); } }, fineLabel(-screen.fine)),
        h("button", { class:"btn", type:"button", "aria-label":"plus " + screen.fine + " " + screen.unit,
          onclick: function(){ slider.nudge(screen.fine); } }, fineLabel(screen.fine))
      ]),
      confirmButton()
    ])
  ]);
}

function screenStorage(screen){
  var counts = JSON.parse(JSON.stringify(answerFor(screen)));
  state.answers[screen.id] = counts;
  save();

  var rows = h("div", { class:"rows" });
  CONFIG.storageItems.forEach(function(it){
    var num = h("div", { class:"count", text: String(counts[it.key] || 0), "aria-live":"polite" });
    var minus = h("button", { class:"cbtn", type:"button", "aria-label":"one fewer " + it.label, html: ICON.minus });
    var plus  = h("button", { class:"cbtn", type:"button", "aria-label":"one more " + it.label, html: ICON.plus });
    function set(n){
      if (n < 0) n = 0;
      counts[it.key] = n;
      num.textContent = String(n);
      minus.disabled = (n === 0);
      state.answers[screen.id] = counts;
      save();
      buzz();
    }
    minus.disabled = (counts[it.key] || 0) === 0;
    minus.addEventListener("click", function(){ set((counts[it.key]||0) - 1); });
    plus.addEventListener("click", function(){ set((counts[it.key]||0) + 1); });
    rows.appendChild(h("div", { class:"row" }, [
      h("div", { class:"label", text: it.label }),
      h("div", { class:"counter" }, [minus, num, plus])
    ]));
  });

  return h("div", { class:"screen" }, [
    titles(screen),
    h("div", { class:"hint", text:"Cylinders in storage for this room." }),
    h("div", { class:"scroll" }, rows),
    h("div", { class:"controls" }, [confirmButton()])
  ]);
}

function screenPh(screen){
  function choose(kind){
    state.answers[screen.id] = { state: kind };
    saveNow();
    confirmScreen();
  }
  return h("div", { class:"screen" }, [
    titles(screen),
    h("div", { class:"center" }, [
      h("div", { class:"prompt", text: CONFIG.ph.prompt })
    ]),
    h("div", { class:"controls" }, [
      h("button", { class:"btn btn-primary", type:"button", onclick: function(){ choose("already"); } },
        [h("span", { class:"chev", html: ICON.check }), h("span", { text: CONFIG.ph.alreadyButton })]),
      h("button", { class:"btn btn-lg", type:"button", onclick: function(){ choose("recal"); } },
        [h("span", { class:"chev", html: ICON.check }), h("span", { text: CONFIG.ph.recalButton })])
    ])
  ]);
}

function reviewValue(screen){
  var a = answerFor(screen);
  if (screen.kind === "psi")  return { text: a + " psi", small:false };
  if (screen.kind === "ln")   return { text: a + "%", small:false };
  if (screen.kind === "storage") return { text: storageText(a), small:true };
  if (screen.kind === "ph"){
    return { text: phState(a) === "recal" ? "Recalibrated today" : "Calibrated", small:true };
  }
  return { text:"", small:true };
}
function screenReview(){
  var list = h("div", { class:"pad" });
  var lastStop = -1;
  SCREENS.forEach(function(s, i){
    if (s.stopIndex !== lastStop){
      lastStop = s.stopIndex;
      list.appendChild(h("div", { class:"group", text: s.heading }));
    }
    var v = reviewValue(s);
    list.appendChild(h("button", { class:"item", type:"button", onclick: function(){ editFromReview(i); } }, [
      state.flags[s.id] === undefined ? null : h("div", { class:"flag", html: ICON.warnSm }),
      h("div", { class:"who", text: s.sub }),
      h("div", { class:"what" + (v.small ? " small" : ""), text: v.text }),
      h("div", { class:"chev", html: ICON.chev })
    ]));
  });

  return h("div", { class:"app" }, [
    h("div", { class:"topbar" }, [
      h("button", { class:"iconbtn", type:"button", onclick: function(){
        state.index = SCREENS.length - 1; state.phase = "check"; render();
      }}, [h("span", { class:"chev", html: ICON.back }), h("span", { text:"Back" })]),
      h("div", { class:"step", text:"Review" })
    ]),
    progressBar(1,1),
    h("div", { class:"screen" }, [
      h("div", { class:"hero" }, [
        h("h1", { text:"Review" }),
        h("p", { text:"Tap anything to fix it." })
      ]),
      h("div", { class:"scroll" }, list),
      h("div", { class:"controls" }, [
        h("button", { class:"btn btn-primary", type:"button", onclick: function(){
          state.phase = "output"; saveNow(); render();
        }}, [h("span", { text:"Build Slack message" }), h("span", { class:"chev", html: ICON.chev })])
      ])
    ])
  ]);
}

var clearArmed = false, clearTimer = null;
/* The preview is built from the same lines the clipboard gets, with the room
   names really bold, so the box shows what Slack will show. */
function messageBox(lines){
  var box = h("div", { class:"msg" });
  lines.forEach(function(l, i){
    if (i) box.appendChild(document.createTextNode("\n"));
    if (l.blank) return;
    if (l.head){
      box.appendChild(h("b", { text: l.text }));
      if (l.warn) box.appendChild(document.createTextNode(CONFIG.attention.roomMark));
    } else {
      box.appendChild(document.createTextNode(l.text));
    }
  });
  return box;
}

function screenOutput(){
  var lines = buildMessageLines();
  var pre = messageBox(lines);

  var copyBtn = h("button", { class:"btn btn-primary", type:"button", onclick: function(){
    copyMessage(lines).then(function(ok){
      if (ok) toast("Copied. Paste it into Slack.");
      else toast("Copy blocked. Press and hold the message to select it.");
    });
  }}, [h("span", { class:"chev", html: ICON.copy }), h("span", { text:"Copy" })]);

  var newBtn = h("button", { class:"btn", type:"button" }, "Start new check");
  newBtn.addEventListener("click", function(){
    if (!clearArmed){
      clearArmed = true;
      newBtn.textContent = "Tap again to clear this check";
      clearTimeout(clearTimer);
      clearTimer = setTimeout(function(){
        clearArmed = false;
        newBtn.textContent = "Start new check";
      }, 4000);
      return;
    }
    clearArmed = false;
    clearTimeout(clearTimer);
    startFresh();
  });

  return h("div", { class:"app" }, [
    h("div", { class:"topbar" }, [
      h("button", { class:"iconbtn", type:"button", onclick: function(){ state.phase = "review"; render(); } },
        [h("span", { class:"chev", html: ICON.back }), h("span", { text:"Review" })]),
      h("div", { class:"step", text:"Done" })
    ]),
    progressBar(1,1),
    h("div", { class:"screen" }, [
      h("div", { class:"hero" }, [
        h("h1", { text:"Slack message" }),
        h("p", { text:"Copy this into the lab channel." })
      ]),
      h("div", { class:"scroll" }, h("div", { class:"pad" }, pre)),
      h("div", { class:"controls" }, [copyBtn, newBtn])
    ])
  ]);
}

function screenHome(){
  saved = readSaved();
  var hasSaved = !!saved && !!saved.answers && Object.keys(saved.answers).length > 0;
  var finished = hasSaved && (saved.phase === "review" || saved.phase === "output");
  var cardTitle = finished ? "Check finished" : "Check in progress";
  var stepText = "";
  if (finished){
    stepText = "Every reading taken, saved " + relTime(saved.savedAt);
  } else if (hasSaved){
    stepText = "Step " + (Math.min((saved.index||0)+1, SCREENS.length)) + " of " + SCREENS.length +
               ", saved " + relTime(saved.savedAt);
  }

  var buttons = hasSaved
    ? [
        h("button", { class:"btn btn-primary", type:"button", onclick: resume },
          finished ? "Open the message" : "Resume check"),
        h("button", { class:"btn", type:"button", onclick: startFresh }, "Start over")
      ]
    : [ h("button", { class:"btn btn-primary", type:"button", onclick: startFresh }, "Start check") ];

  var stops = CONFIG.route.map(function(s){
    if (s.type === "room") return s.name;
    if (s.type === "ln") return pick(s.title, "LN");
    return pick(s.title, "pH probe");
  }).join(", ");

  return h("div", { class:"app" }, [
    h("div", { class:"screen" }, [
      h("div", { class:"scroll" }, h("div", null, [
        h("div", { class:"hero" }, [
          h("h1", { text: CONFIG.appTitle })
        ]),
        h("div", { class:"pad" }, [
          h("div", { class:"card" }, [
            h("h2", { text: todayMD() + " round, " + SCREENS.length + " steps" }),
            h("p", { text: stops })
          ]),
          h("div", { class:"card cardrow" }, [
            h("div", { class:"cardicon", html: ICON.warn }),
            h("p", { text: CONFIG.attention.homeHint })
          ]),
          hasSaved ? h("div", { class:"card" }, [
            h("h2", { text: cardTitle }),
            h("p", { text: stepText })
          ]) : null
        ])
      ])),
      h("div", { class:"controls" }, buttons)
    ])
  ]);
}


/* ---------- clipboard ----------
   Slack only turns *asterisks* and :shortcodes: into formatting while you
   type them. Pasted text is taken literally, which is why a plain text copy
   arrives on a phone with the asterisks showing. So the copy button puts the
   message on the clipboard twice over: once as formatted text and once as
   plain text. Slack takes the formatted one and the room names arrive bold,
   with nothing to tidy up. Anything that cannot read formatting falls back to
   the plain copy, which by default carries no markup either. */
function copyMessage(lines){
  var html = messageHtml(lines);
  var plain = messagePlain(lines, CONFIG.copyStyle);

  return new Promise(function(resolve){
    /* 1. both versions at once, the modern way */
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem && window.isSecureContext){
      try {
        var item = new ClipboardItem({
          "text/html":  new Blob([html],  { type:"text/html"  }),
          "text/plain": new Blob([plain], { type:"text/plain" })
        });
        navigator.clipboard.write([item]).then(
          function(){ resolve(true); },
          function(){ resolve(copyViaEvent(html, plain) || copyPlain(plain)); }
        );
        return;
      } catch(e){ /* fall through */ }
    }
    /* 2. older browsers, and anywhere the write above is refused */
    if (copyViaEvent(html, plain)){ resolve(true); return; }
    /* 3. last resort, plain text only */
    resolve(copyPlain(plain));
  });
}

/* Answers the copy event with our own markup. The obvious alternative, letting
   the browser copy a selected piece of the page, drags this page's colours
   onto the clipboard with it: copied in dark mode that is near white text,
   which can paste white on white. This way the clipboard gets exactly the
   bold and line breaks we wrote and nothing else. */
function copyViaEvent(html, plain){
  var box = null, ok = false;
  var handler = function(e){
    try {
      e.clipboardData.setData("text/html", html);
      e.clipboardData.setData("text/plain", plain);
      e.preventDefault();
    } catch(err){}
  };
  try {
    /* something has to be selected or execCommand("copy") never fires */
    box = document.createElement("div");
    box.textContent = " ";
    box.setAttribute("contenteditable", "true");
    box.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;";
    document.body.appendChild(box);
    var range = document.createRange();
    range.selectNodeContents(box);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.addEventListener("copy", handler, true);
    ok = document.execCommand("copy");
    sel.removeAllRanges();
  } catch(e){ ok = false; }
  document.removeEventListener("copy", handler, true);
  if (box && box.parentNode) box.parentNode.removeChild(box);
  return ok;
}

function copyPlain(text){
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    try { navigator.clipboard.writeText(text); return true; } catch(e){}
  }
  return legacyCopy(text);
}
function legacyCopy(text){
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.width = "1px";
    ta.style.height = "1px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, text.length); } catch(e){}
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}


/* ---------- render ---------- */
function render(){
  if (activeSlider){ activeSlider.destroy(); activeSlider = null; }
  var root = document.getElementById("app");
  var next;

  if (state.phase === "home"){
    next = screenHome();
  } else if (state.phase === "review"){
    next = screenReview();
  } else if (state.phase === "output"){
    next = screenOutput();
  } else {
    var screen = SCREENS[state.index];
    var inner =
      screen.kind === "psi"     ? screenSlider(screen) :
      screen.kind === "ln"      ? screenSlider(screen) :
      screen.kind === "storage" ? screenStorage(screen) :
                                  screenPh(screen);
    next = h("div", { class:"app" }, [
      topBar(),
      progressBar(state.index + 1, SCREENS.length),
      inner
    ]);
  }

  next.id = "app";
  root.parentNode.replaceChild(next, root);
}

/* ---------- go ---------- */
saved = readSaved();
render();
</script>
